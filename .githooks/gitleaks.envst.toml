title = "Gitleaks Configuration"

[extend]
# Keep default Gitleaks rules active
useDefault = true

[[allowlists]]
description = "Allowlist for test files"
paths = [ '''tests/.*''' ]

[[allowlists]]
description = "Allowlist for test ip"
regexes = [
'''192\.168\.1\.[0-9]''',
'''10\.0\.0\.[0-9]''',
'''172\.16\.0\.[0-9]''',
'''172\.31\.255\.[0-9]'''
]

[[rules]]
id = "internal-ip-address"
description = "Private IPv4 address leak"
regex = '''\b(?:10\.\d{1,3}|172\.(?:1[6-9]|2[0-9]|3[0-1])|192\.168)\.\d{1,3}\.\d{1,3}\b'''
tags = ["network", "ip"]

[[rules]]
id = "user_name_1"
description = "User info"
regex = "(?i)${USER}"
tags = ["system", "user_name"]

[[rules]]
id = "user_name_2"
description = "User info"
regex = "(?i)${LOGNAME}"
tags = ["system", "user_name"]

[[rules]]
id = "computer_name"
description = "Computer Name"
regex = "(?i)${HOSTNAME}"
tags = ["system", "computer_name"]

${ORG_NAME_RULE}
