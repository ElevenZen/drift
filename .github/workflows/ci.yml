name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Configure Git Identity for Tests
        run: |
          git config --global user.name "Drift CI"
          git config --global user.email "ci@drift.local"
          git config --global init.defaultBranch main

      - name: Run Unit Tests with Coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report -m

      - name: Verify CLI Binary & Tab-Completion Generation
        run: |
          drift --help
          drift complete bash
          drift complete zsh
          drift complete fish
          drift help overall

  build-artifacts:
    name: Build & Verify Release Artifacts (Wheel & Zipapp)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip build wheel setuptools

      - name: Configure Git Identity
        run: |
          git config --global user.name "Drift CI"
          git config --global user.email "ci@drift.local"

      - name: Build & Verify Artifacts Pipeline
        run: |
          chmod +x ./script/build_artifacts.bash
          ./script/build_artifacts.bash --rebuild

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drift-release-artifacts
          path: dist/*
          if-no-files-found: error

  verify-installer:
    name: Verify Shell Wrapper & Completion Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Configure Git Identity
        run: |
          git config --global user.name "Drift CI"
          git config --global user.email "ci@drift.local"

      - name: Run Shell Wrapper Installer
        run: |
          chmod +x ./script/shell_wrapper_installer.bash
          ./script/shell_wrapper_installer.bash

      - name: Verify Wrapper Execution
        run: |
          "$HOME/.local/bin/drift" --help
          "$HOME/.local/bin/drift" help overall
          "$HOME/.local/bin/drift" complete --install

      - name: Verify Installed Completion Files
        run: |
          test -f "$HOME/.local/share/bash-completion/completions/drift"
          test -f "$HOME/.local/share/zsh/site-functions/_drift"
          test -f "$HOME/.config/fish/completions/drift.fish"
          echo "All shell completion files verified successfully on disk!"
