# src/{package_name}/{config_filename}
[package]
install_method = "{install_method}"  # Options: "stow" (symlink) or "copy" (physical)
{target_directory_line}
# target_directory_windows = "~"  # Windows-specific destination override
# source_directory = "."          # Package root relative to package directory

# Advanced Flags
# hook_file = "drift_package.py"  # Dynamic Python hook (configure_package(context))
# sudo = false
# fully_controlled_dirs = []      # Sync deletions inside these directories
# enable_render = true
# enable_install = true

# Host Requirements & Prerequisites (Declarative checks; skip package if unmet)
[package.requirements]
# os = ["linux"]                # Allowed OS: "linux", "darwin", "windows", "freebsd"
# arch = ["x86_64", "aarch64"]  # Allowed Arch: "x86_64", "arm64", "aarch64"
# distro = ["arch", "ubuntu"]   # Allowed Linux Distro IDs
# binaries = ["git"]            # Required binaries in host $PATH
# env = ["WAYLAND_DISPLAY"]     # Required environment variables when starting drift
# ip = ["192.168.1.0/24"]       # Matches host LAN IP address (exact, CIDR, or wildcard)

# ---------------------------------------------------------------------
# Package Environment Variables, Native Self-Referencing & Secrets
# ---------------------------------------------------------------------
# Drift TOML configurations natively support topological variable self-referencing ($VAR, ${VAR}).
# External render engines (e.g. drift_package.envst.toml) can also be used if dynamic generation
# is needed, but native self-referencing is the built-in, zero-dependency default for .toml files.
#
# Referencing Rules:
# 1. Topological Stitching in [env.default]: Standard package variables (Package default beats Workspace default).
#    Drift builds a dependency DAG and resolves variables in topological order with cycle detection.
# 2. Secrets in [env.secrets]: Package-scoped private credentials with log masking and clean-room isolation.
# 3. Non-Env Sections: Fields across [package], [hooks], etc. can reference any resolved environment
#    variables (e.g. target_directory = "${HOME}/.config/${drift_package_name}").
#    Variables defined outside environment tables cannot be referenced inside environment tables.
# 4. Values-Only Scope: Variable stitching and interpolation occurs STRICTLY within configuration field values
#    (strings, arrays). Variable references are NEVER evaluated in TOML keys, table names, or section headers.
# 5. Escaping: Use a leading backslash (\${VAR} or \$VAR) to keep literal strings.
# 6. Advanced Priority Tuning: Drift also supports [env.override] (highest priority) and [env.fallback] (soft baseline).
#    See 'drift help drift_package.toml' for full 6-tier details.

[env.default]
# Package default configuration values (Package > Workspace)
# APP_PORT = "8080"
# APP_HOST = "localhost"
# APP_DATA_DIR = "${HOME}/.local/share/${drift_package_name}"

# [env.secrets]
# Package-scoped secrets with clean-room isolation and log masking (Package > Workspace > secrets.env)
# API_SECRET_TOKEN = "pkg_secret_xxxxxxxxxxxx"

# Lifecycle Hooks (Optional, set to script path or "disable" to turn off)
# Note: All package-internal hook scripts and their dependencies MUST reside within 'drift_hooks/' (e.g. drift_hooks/setup.sh).
# If a hook is authored as a template (e.g. drift_hooks/health.sh.envst), configure its rendered name (drift_hooks/health.sh).
# If you want to install hook files or files needed by hooks, create a symlink inside 'drift_hooks/'.
# Drift automatically resolves and renders matching template files into .drift/hooks/ before executing hooks.
[hooks]
# probe               = "drift_hooks/check_deps.sh" # Pre-flight requirement check (Exit 0 = Met, Exit != 0 = Unmet)
# pre_source          = "drift_hooks/pre_source.sh"
# post_render         = "drift_hooks/post_render.sh"
# pre_install         = "drift_hooks/bootstrap.sh"
# post_install        = "drift_hooks/post_install.sh"
# pre_update          = "drift_hooks/pre_update.sh"
# post_update         = "drift_hooks/post_update.sh"
# pre_uninstall       = "drift_hooks/pre_uninstall.sh"
# post_uninstall      = "drift_hooks/post_uninstall.sh"
# health              = "drift_hooks/health.sh"
# timeout             = 120
# rollback_on_failure = true         # Set false (or list of install hooks) if hook failure shouldn't require rollback

# Windows-Specific Lifecycle Hooks (Optional overrides, e.g. post_install = "disable")
[hooks.windows]
# probe               = "drift_hooks/check_deps.bat"
# pre_source          = "drift_hooks/pre_source.ps1"
# post_render         = "drift_hooks/post_render.ps1"
# pre_install         = "drift_hooks/bootstrap.ps1"
# post_install        = "drift_hooks/post_install.ps1"
# pre_update          = "drift_hooks/pre_update.ps1"
# post_update         = "drift_hooks/post_update.ps1"
# pre_uninstall       = "drift_hooks/pre_uninstall.ps1"
# post_uninstall      = "drift_hooks/post_uninstall.ps1"
# health              = "drift_hooks/health.ps1"
# timeout             = 120
# rollback_on_failure = true

# ---------------------------------------------------------------------
# Package-Level Render Engines (Optional Custom Engines or Overrides)
# ---------------------------------------------------------------------
# Packages can define custom render engines or override workspace engines.
# Note: Unlike hook fields (which are names AFTER rendering), 'input_file' fields
# in render engines are specified as names BEFORE rendering (e.g. "custom_data.envst.json").
# This allows Drift to detect engine suffixes and compile input dependencies in topological order.
# [render.custom]
# input_file     = "data.json"
# suffix         = "custom"
# render_command = "bash -c 'cat %i %s'"
