# =====================================================================
# drift_workspace.toml Configuration
# =====================================================================

# ---------------------------------------------------------------------
# Workspace Environment Variables, Native Variable Stitching & Topological Resolution
# ---------------------------------------------------------------------
# Drift configurations natively support topological variable self-referencing and stitching ($VAR, ${VAR})
# directly within .toml files. External render engines (e.g. drift_workspace.local.envst.toml) can also
# be used if desired, but native self-referencing is the built-in, zero-dependency default.
#
# Variable Stitching & Referencing Rules:
# 1. Topological Stitching in [env]: Variables can reference each other (e.g. DRIFT_SAMPLE_SOCKS_PROXY = "...${SOCKS_PROXY_HOST}:${SOCKS_PROXY_PORT}").
#    Drift builds a dependency DAG and resolves variables in topological order with cyclic detection.
# 2. External References: You can reference host environment variables (${HOME}, ${USER}), secret vault entries,
#    and auto-populated system facts (${drift_os}, ${drift_arch}, ${drift_distro}, ${drift_hostname}, ${drift_user}).
# 3. Unidirectional Evaluation Flow: ONLY variables defined in [env] (and inherited process environment/facts)
#    can be referenced across other drift_workspace.toml sections. Variables outside [env] cannot be referenced inside [env].
# 4. Values-Only Scope: Variable stitching and interpolation occurs STRICTLY within configuration field values
#    (strings, arrays). Variable references are NEVER evaluated in TOML keys, table names, or section headers.
# 5. Escaping: Use a leading backslash (\${VAR} or \$VAR) to prevent interpolation and preserve literal text.
[env]
SOCKS_PROXY_HOST = "127.0.0.1"
SOCKS_PROXY_PORT = "1080"
DRIFT_SAMPLE_SOCKS_PROXY = "socks5h://${SOCKS_PROXY_HOST}:${SOCKS_PROXY_PORT}"
DRIFT_SAMPLE_ENV_THEME = "nord-dark"
DRIFT_SAMPLE_ENV_EDITOR = "vim"

# ---------------------------------------------------------------------
# Enabled Packages Registry
# ---------------------------------------------------------------------
# Key: package folder name under src/
# Value: True/False to enable or disable the package globally
# For example, "pkg_a = true" will enable package "pkg_a".
# Entry "DEFAULT = true | false" will set the default value for unlisted packages.
# "DEFAULT = false" is the default setting.
[packages.enable]
DEFAULT = false

# ---------------------------------------------------------------------
# Render Engines Configuration
# ---------------------------------------------------------------------
# Define template rendering engines for compiling dotfiles and configuration templates.
# Note: Standard .toml files already support native ${VAR} self-referencing without engines.
# Render engines below compile template files (e.g. .zshrc.envst, config.j2, or drift_workspace.local.envst.toml).
[render.envsubst]
# Shell script providing env variables for envsubst
# If it's a relative path, it's always relative to the 'config' folder under drift root directory.
# The file is located at "config/envsubst.bash" .
input_file = "envsubst.bash"

# Files with name "file.envst.suffix" or "file.envst" will be rendered using envsubst.
suffix = "envst"

# The output of render_command will be written as render result.
# %i means engine input, %s means source template.
render_command = "bash -c 'source %i && envsubst < %s'"

[render.mustache]
# Json file as the input to mustache template render engine.
# This filename ends with "envst.json", so it need to be rendered with envsubst first to get the actual json file.
input_file = "mustache.envst.json"

# Files with name "file.mustache.suffix" or "file.mustache" will be rendered using mustache.
suffix = "mustache"
render_command = "mustache %i %s"

[render.jinja2]
# JSON configuration file as the input to jinja2 template engine.
# This filename ends with "mustache.json", so it matches the 'mustache' suffix and will be rendered with mustache first.
# This showcases a multi-level dependency tree: envsubst -> mustache -> jinja2.
input_file = "jinja2.mustache.json"

# Files with name "file.j2" or "file.jinja" will be rendered using jinja2.
suffix = "j2"
render_command = "jinja2 %s %i"

# ---------------------------------------------------------------------
# Workspace Configuration
# ---------------------------------------------------------------------
[workspace]
# Global default target directory (supports ~ home expansion and ${VAR} interpolation)
default_target_directory = "~"

# Global default installation method
# Options: "stow" (symlinks) or "copy" (physical copies). Default is "stow".
default_install_method = "stow"

# Source directory for packages, default value is "src"
source_directory = "src"

# Sandbox rendering output path
render_directory = "render"

# Deployment database tracking folder
install_directory = "install"

# Backup archive folder for collisions & deletions
backup_directory = "backup"

# Optional dynamic Python workspace configuration hook file (relative to workspace root).
# Defaults to "config/drift_workspace.py".
# hook_file = "config/drift_workspace.py"
